name: CI

# The plugin is Windows-only: its executors, PTY/ConPTY integration, Git Bash
# resolver and Windows sandbox all assume win32. Every job therefore runs on
# windows-latest (Windows Server 2025 in the hosted image as of 2026-10).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.x
          - 24.x
    env:
      # The hosted image installs WSL without a distribution. Both entries probe
      # this launcher functionally and skip only the WSL execution cases that
      # cannot run.
      DSH_AUDIT_WSL: C:\Windows\System32\wsl.exe
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # CI only reads the checkout; do not leave the token in the worktree.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # package.json declares ^22.19.0 || >=24.0.0; 22.x and 24.x cover the
          # two supported lines (the desktop runtime ships Node 24).
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install the pinned development runtime
        run: npm ci

      - name: Show the toolchain
        shell: bash
        run: |
          node --version
          npm --version
          git --version
          bash --version | head -n 1

      - name: Driver smoke
        shell: bash
        run: npm test

      - name: Full audit suite
        shell: bash
        run: npm run test:audit

      - name: Package dry run
        shell: bash
        run: npm pack --dry-run
