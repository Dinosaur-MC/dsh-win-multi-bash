# Smoke fixture for dsh-win-multi-bash: boots the real loader with EXACTLY the
# rows the plugin wires (win-mb-* rows loading from THIS package's own
# subpaths), then driver.mjs executes one real command through each tool.
#
# __BASH_PATH__ is substituted by the test runner: "" (quoted empty - NOT a
# bare empty value, which YAML parses as null and crashes the executor's
# resolveBashPath) exercises the schema default resolution, a real path pins
# gitBash.bashPath explicitly. Single-quoted: double quotes would treat
# backslashes as escape sequences.

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

# dsh-sandbox-policy (0.1.2+) activates only once the shared projection
# registry is present; mirrors the base bundle ordering.
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

# The base bundle's own ctx.shell provider on win32, mirroring dsh-base's
# ordering. Loading it here beside our rows is the regression guard for the
# failure this fixture first caught: the plugin must neither contend for the
# shell seat (0.1.7 deleted the routing field a selector would need) nor leave
# it unprovided — everything that injects `shell` waits otherwise.
- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'

- id: tasks
  name: '@deepseek-ai/dsh-jobs-local'

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: win-mb-shell-prompt
  name: 'dsh-win-multi-bash/tool-shell-prompt'

- id: win-mb-tool-git
  name: 'dsh-win-multi-bash/tool-git-bash'
  config:
    gitBash:
      bashPath: '__BASH_PATH__'

- id: win-mb-tool-wsl
  name: 'dsh-win-multi-bash/tool-wsl-bash'
